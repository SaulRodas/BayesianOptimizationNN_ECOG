[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-ecog"
version = "0.4.0"
description = "ECoG finger flexion decoding research scaffold"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-eda.txt"]}

[project.optional-dependencies]
test = ["pytest>=8,<10", "nbformat>=5,<6"]
dev = ["nbstripout>=0.7,<1"]

[project.scripts]
tt-ecog-eda = "tt_ecog.eda:main"
tt-ecog-prep = "tt_ecog.prep:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
