# Configuracion central declarativa: NO EJECUTAR OPTUNA hasta completar todos los gates.
# Los valores null son decisiones pendientes y deben causar error en las fases
# que los requieren; no reemplazarlos silenciosamente por defaults.

schema_version: 1
project:
  name: TT_ECoG_FingerFlexion
  dataset: BCI_Competition_IV_Dataset_4
  subjects: [S1, S2, S3]
  execution_environment: colab_pro
  seed_base: 42
  development_only_until_final_evaluation: true

paths:
  raw_dir: raw  # Relativo a persistent_storage_dir, en Drive
  processed_pipeline_id: b26db4c45dc163882b7ca8ca06432b822bd231e4ec35780a0285afd34c920fff # Copiar el pipeline_id generado por 02; compartido desde 03
  processed_dir: data/processed
  manifests_dir: data/manifests
  results_dir: results
  eda_dir: results/eda
  preprocessing_dir: results/preprocessing  # Evidencia de cada corrida del paso 2
  training_dir: results/training
  optimization_dir: results/optimization
  evaluation_dir: results/evaluation
  final_run_id: null  # 07 muestra el ID; copiar aqui para reanudar, nunca elegir el mas reciente
  verification_dir: results/verification  # Reportes V01-V14 del paso 3
  test_labels_dir: null  # Resolucion permitida SOLO en evaluacion final
  persistent_storage_dir: TT_ECoG  # Relativo al directorio MyDrive montado

raw_data:
  ecog_fs_hz: 1000
  glove_fs_effective_hz: 25
  expected_channels_nominal:
    S1: 62
    S2: 48
    S3: 64
  n_fingers: 5
  train_file_template: 'sub{subject_number}_comp.mat'
  train_ecog_key: train_data
  train_glove_key: train_dg
  test_ecog_key: test_data
  test_labels_file_template: 'sub{subject_number}_testlabels.mat'
  test_labels_key: test_dg
  io_policy: original_readonly

channels:  # Exclusion fija; se aplica en preprocesamiento ANTES de la CMR
  index_convention: zero_based
  application_stage: preprocessing_before_common_reference
  selection_basis: ecog_acquisition_evidence_only  # nunca etiquetas, predicciones ni Pearson
  excluded:
    S1:
      - index: 54
        reason: "Dos episodios transitorios (166-169 s y 195-196 s); STD local hasta 252x la tipica del canal; salto maximo 646311 u.o."
        evidence_figure: fig/s02_S1_c054.png
    S2:
      - index: 20
        reason: "Transitorios recurrentes (8-12 episodios, 29-45 s de 400 s); STD local hasta 643x la tipica; 99% de la potencia 40-200 Hz en lineas de red."
        evidence_figure: fig/s02_S2_c020.png
      - index: 37
        reason: "Transitorios recurrentes (9-10 episodios, 48-60 s de 400 s); STD local hasta 1817x la tipica; STD basal anomala (376 frente a mediana 1794 del sujeto)."
        evidence_figure: fig/s02_S2_c037.png
    S3: []

eda:  # Resoluciones descriptivas del EDA; no son decisiones ni umbrales
  development_labels_use: descriptive_only  # train_dg solo para graficas confirmatorias; test nunca
  window_seconds: 1.0
  psd_window_seconds: 2.0
  psd_overlap_fraction: 0.5
  line_zoom_psd_window_seconds: 10.0
  line_half_width_hz: 1.0
  numerical_epsilon: 1.0e-12
  std_ratio_levels: [10, 20, 50]
  episode_context_seconds: 2.0
  excerpt_seconds: 10.0
  correlation_excerpt_seconds: 60.0
  lag_range_seconds: [-1.0, 1.0]
  autocorr_max_lag_seconds: 10.0
  diagnostic_morlet:  # solo para el ERSP de justificacion de banda
    freq_range_hz: [4, 250]
    n_frequencies: 50
    n_cycles: 7
  movement:
    speed_quantile: 0.9
    min_interonset_seconds: 1.0
    ersp_window_seconds: [-1.0, 1.5]
    baseline_seconds: [-1.0, -0.5]
  figure_dpi: 110
  plot_max_points: 4000

signal:
  target_fs_hz: 100
  bandpass_hz: [40, 200]
  notch_hz: [60, 120, 180]
  common_reference: common_median_instantaneous
  no_global_temporal_zscore: true
  filtering:
    segmentwise: true
    phase: zero  # kernel FIR centrado aplicado una vez (sin filtfilt)
    library: scipy_firwin
    fir_window: hamming
    bandpass_l_trans_hz: 10  # -6 dB en 35 Hz; 331 taps
    bandpass_h_trans_hz: 20  # -6 dB en 210 Hz; atenua el armonico de 240 Hz
    notch_width_hz: 2  # banda de rechazo por linea
    notch_trans_hz: 2  # 1651 taps; kernel combinado +/-990 ms
    pad: reflect_with_edge_masks
    preserve_edge_masks: true
  morlet:
    output: power
    spacing: log
    n_frequencies: 40
    freq_range_hz: [40, 200]
    n_cycles: 7
    zero_mean: true
    implementation: mne_tfr_array_morlet  # decim de MNE prohibido (no tiene antialias)
  resample:
    source_fs_hz: 1000
    target_fs_hz: 100
    antialias: true
    antialias_fir:
      window: kaiser
      passband_hz: 35
      stopband_hz: 50
      attenuation_db: 60
    preserve_timestamps: true
  glove:
    effective_fs_hz: 25
    target_fs_hz: 100
    interpolation: cubic
    validate_stored_1khz_upsampling: true
    storage_factor: 40  # filas de 1 kHz por muestra efectiva de 25 Hz
    sample_time: first_row_of_hold
    spline: cubic_not_a_knot_per_segment
    extrapolate: false
  temporal_alignment:
    delay_ms: 200
    delay_samples_at_target_fs: 20
    direction: ecog_t_to_flexion_t_plus_delay
    prevent_fold_boundary_crossing: true

validation:
  design: purged_blocked_cv
  n_base_blocks: 5
  block_names: [B1, B2, B3, B4, B5]
  stage1_validation_blocks: [B2, B4]
  stage2_validation_blocks: [B1, B2, B3, B4, B5]
  purge_samples_at_100hz: 256  # Aprobada 2026-10-19 con V04/V09 reales; ver docs/experimental_log.md
  purge_candidate_for_tests: 256
  train_window_samples: 256
  train_stride_samples: 1
  inference_window_samples: 256
  inference_stride_samples: 64
  allow_windows_across_gaps: false
  score_reconstruction: overlap_add
  coverage_policy: full_valid_timestamps_required

scaling:
  ecog:
    type: robust
    quantile_range_percent: [10, 90]
    unit_variance: true
    fit_only_on: fold_train
    feature_axis: channel_frequency
  targets:
    type: minmax
    feature_range: [0, 1]
    fit_only_on: fold_train
    inverse_transform_for_error_metrics: true

model:
  name: unet1d
  input_frequency_bins: 40
  output_channels: 5
  reference:
    encoder_levels: 5
    base_filters: 64
    encoder_kernels: [7, 7, 5, 5, 5]
    encoder_dilations: [1, 2, 3, 1, 2]
    encoder_strides: [2, 2, 2, 2, 2]
    channel_multipliers: [1, 1, 2, 4, 8, 8]
  normalization: batchnorm1d
  activation: gelu
  dropout: 0.3
  encoder: dilated_conv1d_with_temporal_downsampling
  decoder: interpolate_linear_plus_conv1d
  skip_connection: concat
  interpolate_to_skip_length: true
  final_conv_kernel: 1
  # Detalles fijados por la persona usuaria (2026-10-18) antes de V13:
  spatial_reduce_kernel: 3  # Conv1d(C*40 -> f) compartida en el tiempo + BN + GELU + Dropout
  temporal_downsampling: maxpool1d  # MaxPool1d(2) tras cada bloque del encoder; skip antes de reducir
  decoder_block_order: interpolate_conv_norm_activation_dropout_concat
  decoder_dilation: 1  # el decoder espeja los kernels del encoder, sin dilatacion
  initialization: pytorch_default  # mismo criterio para todas las variantes

training:
  optimizer: adamw
  scheduler: none
  adamw_weight_decay_policy: all_trainable_parameters
  reference_learning_rate: 0.0000842
  reference_weight_decay: 0.0001
  loss:
    name: mse_plus_temporal_cosine
    mse_weight: 0.5
    cosine_weight: 0.5
    cosine_axis: temporal_per_finger
    eps: 1.0e-8
  batch_size: null  # Definir con memoria medida en la GPU real de Colab Pro
  batch_size_initial_candidate: 128
  search_epochs: null  # DECISION POSTERIOR tras estudio de convergencia
  search_epochs_candidate: 50  # Propuesta de la persona usuaria; piloto, no aprobacion automatica
  profile_warmup_steps: 2
  profile_measured_steps: 3
  loader_workers: 2  # Solo rendimiento: procesos que arman batches de train en paralelo; mismos batches y orden
  final_max_epochs: null  # DECISION POSTERIOR, separada de search_epochs
  final_validation_block: B5  # Autorizado: bloque interno comun para A/B/C y los tres sujetos
  search_early_stopping: false
  search_checkpoint_selection: last_epoch
  search_checkpoint_metric: val_pearson_full
  final_early_stopping: true
  final_early_stopping_patience: null  # Definir con validacion de desarrollo
  final_early_stopping_min_delta: null
  final_checkpoint_metric: val_pearson_full
  final_retrain_full_development_after_epoch_selection: true
  common_seeds_between_configurations: true

metrics:
  objective: pearson_macro_five_fingers
  pearson_scope: reconstructed_full_valid_trajectories
  pearson_constant_series_policy: mark_invalid
  degenerate_std_relative: 1.0e-9  # STD <= 1e-9 * max|x|: serie casi constante, Pearson indefinido
  secondary: [pearson_per_finger, mse, rmse, ccc, val_loss]
  metrics_include_train_and_val_curves: true
  selection_is_multiobjective: false

convergence_study:  # Autorizado 2026-10-20: diagnostico para decidir training.search_epochs; no es busqueda
  subjects: [S1, S2, S3]
  validation_block: B2
  epochs: 60
  candidate_epochs: [30, 40, 50]
  horizon_epochs: [56, 60]  # desempeno de referencia: media de estas epocas, ambas incluidas
  second_seed_offset: 1000  # semilla B de la referencia = semilla del fold + este valor
  learning_rates: [3.0e-5, 2.5e-4, 7.5e-4]  # con la arquitectura de referencia, ademas de su LR
  architectures:  # con el LR de referencia, ademas de la arquitectura de referencia
    - {kernel_size: 3, encoder_levels: 3, base_filters: 32}
    - {kernel_size: 7, encoder_levels: 5, base_filters: 96}

optimization:
  algorithm: optuna_tpe
  study_direction: maximize
  persistent_studies_required: true
  stage1:
    trials_per_subject: 20
    validation_blocks: [B2, B4]
    n_startup_trials: 5
    reevaluation:  # Autorizado 2026-10-20: los mejores trials se puntuan tambien en los folds restantes
      top_trials: 3
      validation_blocks: [B1, B3, B5]  # LR/WD de B, C y etapa 2 = mayor media de los cinco folds
    search:
      learning_rate: {type: float_log, min: 1.0e-5, max: 1.0e-3}
      weight_decay: {type: float_log, min: 1.0e-6, max: 1.0e-2}
  stage2:
    trials_per_subject: 10
    validation_blocks: [B1, B2, B3, B4, B5]
    n_startup_trials: 3
    fix_learning_rate_and_weight_decay_from_stage1: true
    kernel_construction: '[7,7] + [kernel_size] * (encoder_levels - 2)'
    filters_construction: '[f,f,2*f,4*f,8*f,8*f][:encoder_levels+1]'
    search:
      kernel_size: [3, 5, 7]
      encoder_levels: [3, 4, 5]
      base_filters: [32, 64, 96]
    enqueue_reference_architecture_within_budget:
      kernel_size: 5
      encoder_levels: 5
      base_filters: 64
  budgets:
    stage1_total_fits: 120
    stage1_reevaluation_fits: 27
    stage2_total_fits: 150
    combined_search_fits: 297

verification:
  support_tolerance: 1.0e-6  # Tolerancia del soporte medido, independiente del EDA
  required_test_ids: [V01, V02, V03, V04, V05, V06, V07, V08, V09, V10, V11, V12, V13, V14]
  status: approved
  all_pass_required: true
  automatically_freeze_on_all_pass: false  # Emitir manifiesto, solicitar aprobacion
  approved_manifest_file: results/verification/20261020T021853Z_19507c/approved_pipeline_manifest.json
  isolation_tolerance: 0.0  # V07/V08 en la misma sesion: valores validos identicos bit a bit
  reproducibility_rtol: 1.0e-6  # V11: persistido frente a recalculado en otra sesion
  architecture_batch_size: 2  # V13: forward/backward de prueba, no es el batch de entrenamiento

final_evaluation:
  variants: [baseline_A, training_optimized_B, architecture_optimized_C]
  train_subject_specific: true
  test_labels_access_stage: final_only
  reuse_preprocessing_for_all_variants: true
  identical_metric_definitions: true
  require_locked_protocol: true
